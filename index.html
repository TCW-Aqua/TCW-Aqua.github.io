<!DOCTYPE html>

<html lang="zh-Hant"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6ec">
  <meta name="description" content="王醫師｜衛生福利部桃園醫院腎臟病防治中心。以淺白易懂的方式，陪您認識腎臟健康與治療。">
  <title>王醫師｜腎臟健康照護</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #253b34;
      --muted: #63766d;
      --green: #537b67;
      --green-dark: #3c6150;
      --green-pale: #e8efe6;
      --cream: #f5f6ec;
      --paper: #fffefa;
      --line: #e2e8dc;
      --shadow: 0 18px 48px rgba(46, 75, 59, .09);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
      font-size: 18px;
      line-height: 1.85;
      letter-spacing: .025em;
    }

    a { color: inherit; }

    .page {
      width: min(100% - 36px, 920px);
      margin-inline: auto;
      padding: 28px 0 22px;
    }

    .topline {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
      color: var(--green-dark);
      font-size: .9rem;
      font-weight: 700;
    }

    .brand-mark {
      display: grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 13px;
      background: var(--green-pale);
      color: var(--green-dark);
    }

    .brand-mark svg { width: 23px; height: 23px; }

    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 58px);
      border: 1px solid rgba(83, 123, 103, .12);
      border-radius: 30px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .hero::after {
      position: absolute;
      z-index: 0;
      top: -110px;
      right: -85px;
      width: 290px;
      height: 290px;
      border: 1px solid rgba(83, 123, 103, .14);
      border-radius: 50%;
      box-shadow: 0 0 0 25px rgba(232, 239, 230, .48), 0 0 0 52px rgba(232, 239, 230, .25);
      content: "";
      pointer-events: none;
    }

    .hero-content { position: relative; z-index: 1; max-width: 660px; }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 12px;
      color: var(--green-dark);
      font-size: .92rem;
      font-weight: 700;
    }

    .eyebrow .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #8ba98d;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.65rem, 8vw, 4.4rem);
      font-weight: 800;
      letter-spacing: .04em;
      line-height: 1.2;
    }

    .role {
      margin: 12px 0 0;
      color: var(--green-dark);
      font-size: clamp(1.08rem, 3.5vw, 1.35rem);
      font-weight: 700;
    }

    .hospital {
      max-width: 560px;
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .intro {
      max-width: 600px;
      margin: 30px 0 0;
      padding-left: 18px;
      border-left: 3px solid #a5bea5;
      color: #344d41;
      font-size: clamp(1.15rem, 3.6vw, 1.42rem);
      font-weight: 600;
      line-height: 1.8;
    }

    .section { margin-top: 28px; }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0 0 15px;
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: .04em;
    }

    .section-heading::before {
      width: 5px;
      height: 25px;
      border-radius: 5px;
      background: #8ba98d;
      content: "";
    }

    .topics {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .topic {
      min-height: 164px;
      padding: 20px 18px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: rgba(255, 254, 250, .8);
    }

    .topic-icon {
      display: grid;
      width: 44px;
      height: 44px;
      margin-bottom: 12px;
      place-items: center;
      border-radius: 15px;
      background: var(--green-pale);
      color: var(--green-dark);
    }

    .topic-icon svg { width: 24px; height: 24px; }

    .topic h3 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.55;
    }

    .contact {
      display: flex;
      align-items: flex-start;
      gap: 15px;
      padding: 20px;
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #edf2e9;
    }

    .contact-icon {
      display: grid;
      flex: 0 0 44px;
      width: 44px;
      height: 44px;
      place-items: center;
      border-radius: 15px;
      background: var(--paper);
      color: var(--green-dark);
    }

    .contact-icon svg { width: 23px; height: 23px; }

    .contact p { margin: 0; }
    .contact .label { color: var(--muted); font-size: .9rem; }
    .contact .value { margin-top: 2px; font-weight: 700; }

    footer {
      padding: 22px 0 4px;
      color: var(--muted);
      font-size: .85rem;
      text-align: center;
    }

    @media (max-width: 620px) {
      body { font-size: 18px; }
      .page { width: min(100% - 28px, 520px); padding-top: 18px; }
      .hero { border-radius: 24px; }
      .hero::after { top: -135px; right: -160px; width: 250px; height: 250px; }
      .topics { grid-template-columns: 1fr; gap: 10px; }
      .topic { display: flex; min-height: 0; align-items: center; gap: 14px; padding: 15px; }
      .topic-icon { flex: 0 0 44px; margin: 0; }
      .section { margin-top: 25px; }
    }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="topline" aria-label="腎臟健康照護">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">

    <section class="hero" aria-labelledby="doctor-name">

        <p class="role">醫師</p>

    <section class="section" aria-labelledby="topics-title">
      <h2 class="section-heading" id="topics-title">專業主題</h2>
      <div class="topics">
        <article class="topic">
          <span class="topic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s-7.5-4.4-7.5-10.2A4.3 4.3 0 0 1 12 8.2a4.3 4.3 0 0 1 7.5 2.6C19.5 16.6 12 21 12 21Z"></path>
              <path d="M12 8.5v7M8.5 12h7"></path>
            </svg>
          </span>
          <h3>腎臟病防護</h3>
        </article>
        <article class="topic">
          <span class="topic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 6.5h14v11H5z"></path>
              <path d="M8 10h8M8 13.5h5M12 3v3.5M12 17.5V21"></path>
            </svg>
          </span>
          <h3>透析治療</h3>
        </article>
        <article class="topic">
          <span class="topic-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5c2.5 3.4 5.5 6.7 5.5 10.3a5.5 5.5 0 0 1-11 0C6.5 10.2 9.5 6.9 12 3.5Z"></path>
              <path d="M9.5 14.5a2.5 2.5 0 0 0 2.5 2.5"></path>
            </svg>
          </span>
          <h3>電解質矯正</h3>
        </article>
      </div>
    </section>

    <section class="section" aria-labelledby="contact-title">
      <h2 class="section-heading" id="contact-title">聯絡方式</h2>
      <div class="contact">
        <span class="contact-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5h16v13H4z"></path>
            <path d="m5 7 7 5.5L19 7"></path>
          </svg>
        </span>
        <div>
          <p class="label">衛教與相關詢問</p>
          <p class="value">請洽桃園醫院衛教小組</p>
        </div>
      </div>
    </section>

    <footer>本頁使用 AI 協助製作</footer>
  </main>


</body></html>
